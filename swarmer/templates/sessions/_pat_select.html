<div style="display:flex; align-items:center; gap:var(--pf-t--global--spacer--xs);">
  <label for="cfg-pat-select" style="font-size:var(--pf-t--global--font--size--sm); color:var(--pf-t--global--text--color--subtle); white-space:nowrap;">GitHub Credential</label>
  <select id="cfg-pat-select" class="pf-v6-c-form-control"
        style="width:auto; font-size:var(--pf-t--global--font--size--sm);"
        onchange="var pc=document.getElementById('repo-picker-container'); if(pc) pc.innerHTML='';
                  document.getElementById('cfg_pat').value=this.value; window._cfgSave && window._cfgSave()"
        {% if session.is_active %}disabled{% endif %}>
  {% if has_github_app %}
  <option value="" {{ 'selected' if not session.github_pat }}>GitHub App</option>
  {% else %}
  <option value="" {{ 'selected' if not session.github_pat }}>— None —</option>
  {% endif %}
  {% for pat in pats %}
  <option value="{{ pat.id }}"
          {{ 'selected' if session.github_pat and session.github_pat.id == pat.id }}>
    {{ pat.name }}
  </option>
  {% endfor %}
  </select>
</div>
