apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarmer
  namespace: swarmer
  labels:
    app: swarmer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swarmer
  # Only one replica safe with SQLite — no concurrent writers
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: swarmer
    spec:
      serviceAccountName: swarmer
      securityContext:
        # FS_GROUP_VALUE is replaced by the deploy Makefile target:
        #   OpenShift:           fsGroup: 1001
        #   generic K8s / kind:  this line is deleted, leaving an empty securityContext: {}
        fsGroup: FS_GROUP_VALUE

      containers:
        - name: swarmer
          # SWARMER_IMAGE is replaced by the deploy Makefile target
          image: SWARMER_IMAGE
          # IMAGE_PULL_POLICY_VALUE: IfNotPresent (kind/generic K8s) or Always (OpenShift)
          imagePullPolicy: IMAGE_PULL_POLICY_VALUE
          ports:
            - containerPort: 8080
              name: http

          env:
            - name: K8S_IN_CLUSTER
              value: "true"
            - name: DATABASE_URL
              value: sqlite+aiosqlite:////data/swarmer.db
            - name: SWARMER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: swarmer-secret
                  key: SWARMER_SECRET_KEY
            - name: K8S_API_URL
              value: "https://kubernetes.default.svc"
            - name: OPENSHIFT_OAUTH_URL
              value: "OPENSHIFT_OAUTH_URL_VALUE"
            - name: REDIRECT_BASE_URL
              value: "REDIRECT_BASE_URL_VALUE"
            - name: DEFAULT_AGENT_TOOL
              value: "DEFAULT_AGENT_TOOL_VALUE"
            - name: AGENT_IMAGE_OPENCODE
              value: "AGENT_IMAGE_OPENCODE_VALUE"
            - name: MAX_CONCURRENT_AGENTS
              value: "MAX_CONCURRENT_AGENTS_VALUE"
            - name: OPENSHELL_GATEWAY_URL
              value: "OPENSHELL_GATEWAY_URL_VALUE"
            - name: OPENSHELL_TLS_CA
              value: "/auth/openshell/ca.crt"
            - name: OPENSHELL_TLS_CERT
              value: "/auth/openshell/tls.crt"
            - name: OPENSHELL_TLS_KEY
              value: "/auth/openshell/tls.key"
            # ACM-41655 — remote/hosted OpenShell gateway auth (e.g. the "swarm"
            # gateway). Defaults to "mtls" (local in-cluster gateway, uses the
            # certs above); set to "oidc" + the three OIDC_* values below to
            # connect to a remote Keycloak-backed gateway instead — see
            # k8s/swarmer/deployment.yaml Makefile substitution (OPENSHELL_AUTH_MODE
            # / OPENSHELL_OIDC_ISSUER / OPENSHELL_OIDC_CLIENT_ID / OPENSHELL_OIDC_AUDIENCE
            # in .env or `make deploy` args). The OIDC refresh token itself is never
            # an env var — seed it via the /admin/openshell-gateway page or
            # `make openshell-oidc-seed`.
            - name: OPENSHELL_AUTH_MODE
              value: "OPENSHELL_AUTH_MODE_VALUE"
            - name: OPENSHELL_OIDC_ISSUER
              value: "OPENSHELL_OIDC_ISSUER_VALUE"
            - name: OPENSHELL_OIDC_CLIENT_ID
              value: "OPENSHELL_OIDC_CLIENT_ID_VALUE"
            - name: OPENSHELL_OIDC_AUDIENCE
              value: "OPENSHELL_OIDC_AUDIENCE_VALUE"

          # Model preset mappings (ACM-37232) — see k8s/swarmer/configmap.yaml.
          # Edit that file directly and re-apply + restart the deployment
          # (no code change or image rebuild needed) when Vertex AI / Google
          # ship new model versions.
          envFrom:
            - configMapRef:
                name: swarmer-model-presets

          volumeMounts:
            - name: swarmer-data
              mountPath: /data
            - name: openshell-tls
              mountPath: /auth/openshell
              readOnly: true

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"

          readinessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: swarmer-data
          persistentVolumeClaim:
            claimName: swarmer-data
        - name: openshell-tls
          secret:
            secretName: openshell-tls
